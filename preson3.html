<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Bob the Blob</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #00f0ff; /* Different punchy background color per character */
            font-family: 'Comic Neue', cursive;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-box {
            background: #fff;
            border: 5px solid #000;
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 10px 10px 0px #000;
            text-align: center;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: #ff0055;
            text-shadow: 3px 3px 0px #000;
            margin: 10px 0;
        }

        .avatar-placeholder {
            width: 150px;
            height: 150px;
            background: #ffde59;
            border: 4px solid #000;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 4px 4px 0px #000;
        }

        .stats {
            background: #ff9aef;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            background-color: #ffde59;
            color: #000;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            padding: 10px 20px;
            border: 3px solid #000;
            border-radius: 20px;
            box-shadow: 4px 4px 0px #000;
            text-decoration: none;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: #ff5722;
            color: white;
        }
    </style>
</head>
<body>

    <div class="profile-box">
        <!-- Cartoon Avatar / Emoji / Image -->
        <div class="avatar-placeholder">🥴</div>
        
        <h1>Bob the Blob</h1>
        <p style="font-size: 1.3rem;">"If at first you don't succeed, nap time is always an option."</p>

        <div class="stats">
            <p>🦾 **Superpower:** Can melt into any sofa instantly.</p>
            <p>🍕 **Weakness:** Pizza delivery tracking apps.</p>
            <p>🏆 **Biggest Achievement:** Watched an entire TV series in one sitting without blinking.</p>
        </div>

        <a href="saif.html" class="back-btn">⬅ Back to Crew</a>
    </div>

</body>
</html>
